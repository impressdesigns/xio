[project]
name = "idi-xio"
version = "0.10.0"
description = "Command-line helper for Core and Azure"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "jq>=1.13.0",
    "niquests>=3.21.2",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
xio = "xio.cli.app:app"

[build-system]
requires = ["flit-core>=4.2.0"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "xio"

[tool.uv]
# Sync with Dependabot's uv version
required-version = ">=0.11.8"
default-groups = ["dev"]
exclude-newer = "P7D"
# virtualenv 21.14.9 fixes GHSA-c978-59m8-c77v, GHSA-43mp-35q3-x3fq and GHSA-cw65-gx24-rc82 (October 2026).
constraint-dependencies = ["virtualenv>=21.14.9"]

[dependency-groups]
dev = [
    # DX
    "nox>=2026.8.17",
    "prek>=0.5.5",
    # Linters
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "ty>=0.0.87",
    # Tests
    "coverage>=7.16.2",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # (missing-trailing-comma) - Conflicts with formatter
    "CPY001",  # (Missing copyright notice at top of file)
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = [
    "PLR2004", # (magic-value-comparison) - A test asserting a literal is the test
    "S101",    # (Use of `assert` detected) - Yes, that's the point
    "SLF001",  # (private-member-access) - Tests reach into what they are testing
]

"noxfile.py" = [
    "INP001", # (File `noxfile.py` is part of an implicit namespace package.) - Nox finds it by name
]

[tool.ruff.lint.isort]
known-first-party = ["xio"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
strict = true
pretty = true
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["jq", "niquests", "niquests.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source_pkgs = ["xio"]
source_dirs = ["tests"]
data_file = ".cache/coverage/.coverage"

[tool.pytest]
strict = true
testpaths = ["tests"]
cache_dir = ".cache/pytest"
